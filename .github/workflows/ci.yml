name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint latest scripts
        run: shellcheck latest/farmer latest/sprout
      - name: Check latest script formatting
        run: go run mvdan.cc/sh/v3/cmd/shfmt@latest -d latest/farmer latest/sprout
