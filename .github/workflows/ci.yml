name: CI

env:
  CURRENT_VERSION: v1.0.5

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint latest scripts
        run: shellcheck latest/farmer latest/sprout v1.0.5/farmer v1.0.5/sprout
      - name: Check latest script formatting
        run: go run mvdan.cc/sh/v3/cmd/shfmt@latest -d latest/farmer latest/sprout v1.0.5/farmer v1.0.5/sprout
      - name: Check latest scripts match current version
        run: |
          diff -u "latest/farmer" "${CURRENT_VERSION}/farmer"
          diff -u "latest/sprout" "${CURRENT_VERSION}/sprout"
